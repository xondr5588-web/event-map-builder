<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16615a" />
    <meta
      name="description"
      content="행사 현장을 위한 주차·교통 운영도. 네이버 지도 기반 구역, 동선, 인력 배치와 모바일 편집."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>FIELD · 행사 운영도</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <a class="brand" href="./" aria-label="FIELD 행사 운영도 홈"
          ><span class="brand-mark" data-icon="map"></span
          ><span>FIELD<span class="brand-sub">행사 운영도</span></span
          ><small>1.1.2</small></a
        >
        <div class="project-heading">
          <button id="project-title" class="plain" title="프로젝트 이름 변경">
            운영도 불러오는 중…</button
          ><span id="save-status" role="status">준비 중</span>
        </div>
        <div class="header-actions">
          <button
            data-action="save"
            title="버전 저장 (Ctrl+S)"
            aria-label="버전 저장"
            data-icon="save"
          ></button
          ><button
            data-action="export"
            class="desktop-action"
            title="JSON 내보내기"
            aria-label="JSON 내보내기"
            data-icon="download"
          ></button
          ><button data-action="print" class="primary print-entry">
            <span data-icon="print"></span><span>출력</span></button
          ><button
            data-action="more"
            aria-label="더 보기"
            title="더 보기"
            data-icon="more"
          ></button>
        </div>
      </header>
      <main id="workspace">
        <aside id="panel" aria-label="작업 패널">
          <div class="panel-tabs">
            <button data-panel="tools" class="active">만들기</button
            ><button data-panel="objects">
              객체 <span id="object-count">0</span></button
            ><button data-panel="plan">운영계획</button
            ><button data-panel="projects">프로젝트</button
            ><button
              data-action="close-panel"
              class="sheet-close"
              aria-label="패널 닫기"
              data-icon="close"
            ></button>
          </div>
          <div id="panel-content"></div>
          <div class="panel-footer">
            <span class="connection-dot"></span
            ><span id="connection-label">로컬 작업 공간</span
            ><button data-action="help" class="plain">사용법</button>
          </div>
        </aside>
        <section id="stage" aria-label="운영도 지도">
          <div id="print-heading">
            <div>
              <p>FIELD / EVENT OPERATIONS</p>
              <h1 id="print-title"></h1>
              <p id="print-note"></p>
            </div>
            <span id="print-date"></span>
          </div>
          <div id="map-shell">
            <div id="map"></div>
            <div id="offline-grid" aria-hidden="true">
              <span
                >오프라인 도면<span
                  >배경지도는 인터넷 연결 후 표시됩니다.</span
                ></span
              >
            </div>
            <svg
              id="editor"
              xmlns="http://www.w3.org/2000/svg"
              tabindex="0"
              aria-label="운영도 편집 지도"
              role="application"
            ></svg>
            <div class="map-top">
              <form id="search-form">
                <span data-icon="search"></span
                ><input
                  id="address-search"
                  type="search"
                  placeholder="주소 · 장소 · 좌표 검색"
                  aria-label="주소 또는 장소 검색"
                  autocomplete="off"
                /><button
                  type="submit"
                  aria-label="검색 실행"
                  data-icon="arrow"
                ></button>
              </form>
              <div id="search-results" hidden></div>
              <div id="map-notice" hidden role="status"></div>
            </div>
            <div class="map-toolbar" aria-label="지도 편집 도구">
              <button
                data-action="select"
                class="active"
                title="선택 (V)"
                aria-label="선택 모드"
                data-icon="select"
              ></button
              ><button
                data-action="pan"
                title="지도 이동 (H)"
                aria-label="지도 이동 모드"
                data-icon="hand"
              ></button
              ><i></i
              ><button
                data-action="undo"
                title="실행 취소 (Ctrl+Z)"
                aria-label="실행 취소"
                data-icon="undo"
                disabled
              ></button
              ><button
                data-action="redo"
                title="다시 실행 (Ctrl+Shift+Z)"
                aria-label="다시 실행"
                data-icon="redo"
                disabled
              ></button>
            </div>
            <div class="map-controls">
              <button
                data-action="locate"
                title="내 위치"
                aria-label="내 위치"
                data-icon="locate"
              ></button
              ><button
                data-action="fit"
                title="전체 맞춤 (F)"
                aria-label="전체 맞춤"
                data-icon="fit"
              ></button>
              <div class="zoom-control">
                <button
                  data-action="zoom-in"
                  aria-label="확대"
                  data-icon="plus"
                ></button
                ><span id="zoom-level">16</span
                ><button
                  data-action="zoom-out"
                  aria-label="축소"
                  data-icon="minus"
                ></button>
              </div>
              <button
                data-action="map-type"
                id="map-type"
                title="지도 종류 변경"
              >
                위성
              </button>
            </div>
            <div id="inspector" hidden></div>
            <div id="command-bar" hidden></div>
            <div class="map-footer">
              <span id="coordinates"></span
              ><span id="map-provider">지도 연결 중</span>
            </div>
          </div>
          <div id="print-legend"></div>
          <div id="print-footer">
            현장 상황에 따라 운영계획이 달라질 수 있습니다. · FIELD
          </div>
        </section>
      </main>
      <nav id="mobile-nav" aria-label="모바일 작업 도구">
        <button data-panel="tools"><span data-icon="plus"></span>만들기</button
        ><button data-panel="objects">
          <span data-icon="layers"></span>객체</button
        ><button data-panel="plan">
          <span data-icon="folder"></span>운영계획</button
        ><button data-panel="projects">
          <span data-icon="folder"></span>프로젝트</button
        ><button data-action="more">
          <span data-icon="more"></span>더 보기
        </button>
      </nav>
    </div>
    <div id="toast" role="status" hidden></div>
    <div id="persistent-alert" role="alert" hidden></div>
    <dialog id="modal">
      <div class="dialog-heading">
        <h2 id="modal-title"></h2>
        <button
          data-action="close-modal"
          aria-label="창 닫기"
          data-icon="close"
        ></button>
      </div>
      <div id="modal-body"></div>
    </dialog>
    <div id="print-controls" hidden>
      <select id="paper" aria-label="용지 크기">
        <option value="A4 landscape">A4 가로</option>
        <option value="A4 portrait">A4 세로</option>
        <option value="A3 landscape">A3 가로</option>
        <option value="A3 portrait">A3 세로</option></select
      ><label><input id="legend-toggle" type="checkbox" checked />범례</label
      ><button data-action="fit">전체 맞춤</button
      ><button class="primary" data-action="print-now">PDF / 인쇄</button
      ><button data-action="exit-print">편집으로</button>
    </div>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <noscript>이 프로그램을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
